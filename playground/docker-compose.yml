# Multi-hypervisor playground: one NATS/JetStream broker, api-gateway (the
# only client-facing, JWT/OPA-checked entrypoint), one compute control-plane,
# one identity control-plane, one image control-plane, one network
# control-plane, and one block-storage control-plane (none exposed to the
# host -- only api-gateway may reach them; see docs/specs/network.md and
# docs/specs/volume.md), and three compute-agent
# "hypervisors" that self-register with compute at startup, so the real
# scheduler (Ready phase + driver + capacity + zone filters, most-available-
# first pick) has real inventory to spread VMs across. compute-agent boots
# real Firecracker microVMs (see docs/specs/firecracker-boot.md) using
# kernel/rootfs served by image-assets, and needs /dev/kvm passed through --
# if the host doesn't have KVM (or your user can't access /dev/kvm), this
# will fail to boot the actual guest but everything else in the stack still
# works. A VM created with network_interfaces also gets a real tap device
# wired to a local Linux bridge (see internal/compute-agent/netsetup and
# docs/specs/network.md); that needs /dev/net/tun and CAP_NET_ADMIN, same
# "fails gracefully, rest of the stack is unaffected" caveat as /dev/kvm.
# Bring it up with
# `docker compose -f playground/docker-compose.yml up -d --build` (from the
# repo root) and drive it with playground/scenario.sh or
# `go run ./cmd/kyuusha vm|tenant|hypervisor|image|subnet|netif|volume|volattach ...
# -addr=localhost:8080 -token=...` (`kyuusha token mint` for a dev token).
#
# Also brings up Jaeger (traces), Prometheus (metrics), Loki+Promtail (logs,
# including the audit trail -- see internal/audit and
# docs/specs/audit-logging.md), and Grafana (dashboards over all three,
# pre-provisioned as datasources) -- see docs/specs/observability-tracing.md
# and observability-metrics.md.
name: kyuusha-playground

# A fixed subnet, so storage-agent can be given a static IP (see its
# comment below for why) instead of Docker's usual dynamically-assigned
# one.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/16

services:
  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:3.3.2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger
      - loki

  compute:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: compute
    command:
      - "-nats-url=nats://nats:4222"
      - "-grpc-addr=:8081"
      - "-identity-addr=identity:8082"
      - "-image-addr=image:8083"
      - "-network-addr=network:8084"
      - "-block-storage-addr=block-storage:8085"
      - "-metrics-addr=:9092"
      - "-otlp-endpoint=jaeger:4317"
    depends_on:
      nats:
        condition: service_healthy
      identity:
        condition: service_started
      image:
        condition: service_started
      network:
        condition: service_started
      block-storage:
        condition: service_started
      jaeger:
        condition: service_started
    # No ports exposed to the host: api-gateway is the only client-facing
    # entrypoint. compute is reachable only from inside the compose network
    # (compute-agent also reaches it directly here, for Hypervisor
    # self-registration -- that's east-west traffic, not through api-gateway).

  identity:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: identity
    command:
      - "-grpc-addr=:8082"
      - "-metrics-addr=:9091"
      - "-otlp-endpoint=jaeger:4317"
    depends_on:
      jaeger:
        condition: service_started
    # No ports exposed to the host: same reasoning as compute above.

  image:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: image
    command:
      - "-grpc-addr=:8083"
      - "-metrics-addr=:9095"
      - "-otlp-endpoint=jaeger:4317"
    depends_on:
      jaeger:
        condition: service_started
    # No ports exposed to the host: same reasoning as compute above.

  network:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: network
    command:
      - "-grpc-addr=:8084"
      - "-metrics-addr=:9096"
      - "-otlp-endpoint=jaeger:4317"
    depends_on:
      jaeger:
        condition: service_started
    # No ports exposed to the host: same reasoning as compute above.

  block-storage:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: block-storage
    command:
      - "-grpc-addr=:8085"
      - "-identity-addr=identity:8082"
      - "-storage-agent-addr=storage-agent:8092"
      - "-metrics-addr=:9097"
      - "-otlp-endpoint=jaeger:4317"
    depends_on:
      identity:
        condition: service_started
      storage-agent:
        condition: service_started
      jaeger:
        condition: service_started
    # No ports exposed to the host: same reasoning as compute above.

  # The real StorageBackend (internal/storage-agent, docs/specs/volume.md):
  # a ZFS pool (sparse-file-backed here) exported over iSCSI. Deliberately
  # its own container/process, not folded into block-storage -- it's the
  # "storage node" compute-agent's iSCSI initiator dials directly and
  # separately from block-storage's own control-plane traffic, matching
  # docs/architecture.md's "専用ストレージノード" design (and unlike
  # block-storage, which is never itself in the actual VM I/O path).
  storage-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: storage-agent
    privileged: true # ZFS (/dev/zfs) + LIO (configfs) kernel interfaces -- same "cgroupfs is read-only without this" reasoning as compute-agent's own privileged:true, see docs/specs/firecracker-boot.md
    pid: host # `zpool create` genuinely fails from inside a container's own mount namespace (confirmed live via strace -- ZFS_IOC_POOL_CREATE itself returns ENOENT); internal/storage-agent works around this by nsenter-ing into PID 1's mount namespace for every zpool/zfs/targetcli call, which needs PID 1 to actually be the *host's* init -- see internal/storage-agent's package doc comment.
    # ${PWD}/playground/storage-agent-data as BOTH the bind mount's source
    # (host path) and target (container path), deliberately identical:
    # nsenter'd commands run in the host's mount namespace, so the backing
    # file's path string has to already mean the same file there too, not
    # just from this container's own view. scenario.sh always invokes
    # `docker compose` from the repo root, so ${PWD} here is that root.
    volumes:
      - ${PWD}/playground/storage-agent-data:${PWD}/playground/storage-agent-data
    # A static IP, not the `storage-agent` DNS name Docker's embedded
    # resolver would otherwise give it: compute-agent's iSCSI initiator
    # (internal/compute-agent/iscsi) has to run in the *host's* network
    # namespace (see its package doc comment for why), where Docker's
    # per-compose-network DNS isn't reachable at all -- but a container's
    # bridge IP is always directly routable from the host, so a fixed one
    # sidesteps needing a resolve-then-nsenter dance.
    networks:
      default:
        ipv4_address: 172.30.0.10
    command:
      - "-grpc-addr=:8092"
      - "-metrics-addr=:9098"
      - "-otlp-endpoint=jaeger:4317"
      # Not the standard iSCSI port 3260: found live that this dev sandbox's
      # firewall silently drops (refuses) *any* listener on 3260, even a
      # plain userspace socket over loopback -- nothing to do with LIO or
      # this code. ExportVolume creates the real LIO network portal on
      # whatever port is named here (see internal/storage-agent), so this
      # just moves it off the blocked one; a real deployment would use its
      # own reachable host:port (cmd/storage-agent/main.go's actual
      # default is storage-agent:3260, a real DNS name -- this static-IP
      # requirement is specific to this playground's compute-agent
      # containers needing the host's network namespace, not to
      # storage-agent itself).
      - "-portal-host=172.30.0.10:33260"
      - "-zpool-backing-file=${PWD}/playground/storage-agent-data/zpool-backing.img"
    depends_on:
      jaeger:
        condition: service_started
    # No ports exposed to the host: iSCSI (3260) and gRPC (8092) are both
    # only ever reached from inside the compose network (compute-agent and
    # block-storage respectively).

  api-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api-gateway
    command:
      - "-listen-addr=:8080"
      - "-compute-addr=compute:8081"
      - "-identity-addr=identity:8082"
      - "-image-addr=image:8083"
      - "-network-addr=network:8084"
      - "-block-storage-addr=block-storage:8085"
      - "-metrics-addr=:9093"
      - "-otlp-endpoint=jaeger:4317"
    depends_on:
      - compute
      - identity
      - image
      - network
      - block-storage
      - jaeger
    ports:
      - "8080:8080"

  # Prebuilt Firecracker kernel + rootfs for the playground's real microVM
  # boot milestone (see docs/specs/firecracker-boot.md), served over plain
  # HTTP so compute-agent can fetch them as ordinary Image artifact URLs --
  # not reachable from the host, only from compute-agent containers.
  image-assets:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: image-assets-server

  compute-agent-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: compute-agent
    command:
      - "-nats-url=nats://nats:4222"
      - "-compute-addr=compute:8081"
      - "-hypervisor=hypervisor-1"
      - "-drivers=FIRECRACKER,QEMU"
      - "-metrics-addr=:9094"
      - "-otlp-endpoint=jaeger:4317"
    # /dev/kvm and /dev/net/tun no longer need individual `devices:`
    # entries now that the whole host /dev is bind-mounted below (needed
    # anyway for a different reason -- see that volume's own comment); the
    # container is already fully privileged, so it has access to whatever
    # host device nodes it can see regardless of how they got there.
    cap_add:
      - NET_ADMIN # tap device + bridge creation, see internal/compute-agent/netsetup
    # cgroupfs is mounted read-only for any non-privileged container
    # regardless of individual capabilities (confirmed: SYS_ADMIN alone did
    # not make it writable) -- needed for internal/compute-agent/cgroup's
    # delegation to work. compute-agent already runs as a highly-trusted,
    # full-root process with /dev/kvm/NET_ADMIN, so this is a small marginal
    # increase for playground purposes only.
    privileged: true
    # So that `nsenter --net=/proc/1/ns/net` (internal/compute-agent/iscsi,
    # docker/compute-agent-entrypoint.sh) via /proc/1 actually reaches the
    # *host's* network namespace, not just this container's own: a real
    # iSCSI login's kernel session creation (a NETLINK_ISCSI socket)
    # doesn't work from inside a container's own network namespace at all
    # -- see internal/compute-agent/iscsi's package doc comment for the
    # full story.
    pid: host
    # A successful iSCSI login creates a real host-level block device node
    # (/dev/disk/by-path/...), not a container-local one (see
    # internal/compute-agent/iscsi's package doc comment) -- bind-mounting
    # the host's actual /dev is what makes that node (and /dev/kvm,
    # /dev/net/tun, previously listed individually under `devices:`) show
    # up inside this container at all, so Firecracker/QEMU (running inside
    # it) can open it as a drive.
    volumes:
      - /dev:/dev
    depends_on:
      nats:
        condition: service_healthy
      compute:
        condition: service_started

  compute-agent-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: compute-agent
    command:
      - "-nats-url=nats://nats:4222"
      - "-compute-addr=compute:8081"
      - "-hypervisor=hypervisor-2"
      - "-drivers=FIRECRACKER,QEMU"
      - "-metrics-addr=:9094"
      - "-otlp-endpoint=jaeger:4317"
    # /dev/kvm and /dev/net/tun no longer need individual `devices:`
    # entries now that the whole host /dev is bind-mounted below (needed
    # anyway for a different reason -- see that volume's own comment); the
    # container is already fully privileged, so it has access to whatever
    # host device nodes it can see regardless of how they got there.
    cap_add:
      - NET_ADMIN # tap device + bridge creation, see internal/compute-agent/netsetup
    # cgroupfs is mounted read-only for any non-privileged container
    # regardless of individual capabilities (confirmed: SYS_ADMIN alone did
    # not make it writable) -- needed for internal/compute-agent/cgroup's
    # delegation to work. compute-agent already runs as a highly-trusted,
    # full-root process with /dev/kvm/NET_ADMIN, so this is a small marginal
    # increase for playground purposes only.
    privileged: true
    # So that `nsenter --net=/proc/1/ns/net` (internal/compute-agent/iscsi,
    # docker/compute-agent-entrypoint.sh) via /proc/1 actually reaches the
    # *host's* network namespace, not just this container's own: a real
    # iSCSI login's kernel session creation (a NETLINK_ISCSI socket)
    # doesn't work from inside a container's own network namespace at all
    # -- see internal/compute-agent/iscsi's package doc comment for the
    # full story.
    pid: host
    # A successful iSCSI login creates a real host-level block device node
    # (/dev/disk/by-path/...), not a container-local one (see
    # internal/compute-agent/iscsi's package doc comment) -- bind-mounting
    # the host's actual /dev is what makes that node (and /dev/kvm,
    # /dev/net/tun, previously listed individually under `devices:`) show
    # up inside this container at all, so Firecracker/QEMU (running inside
    # it) can open it as a drive.
    volumes:
      - /dev:/dev
    depends_on:
      nats:
        condition: service_healthy
      compute:
        condition: service_started

  compute-agent-3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: compute-agent
    command:
      - "-nats-url=nats://nats:4222"
      - "-compute-addr=compute:8081"
      - "-hypervisor=hypervisor-3"
      - "-drivers=FIRECRACKER,QEMU"
      - "-metrics-addr=:9094"
      - "-otlp-endpoint=jaeger:4317"
    # /dev/kvm and /dev/net/tun no longer need individual `devices:`
    # entries now that the whole host /dev is bind-mounted below (needed
    # anyway for a different reason -- see that volume's own comment); the
    # container is already fully privileged, so it has access to whatever
    # host device nodes it can see regardless of how they got there.
    cap_add:
      - NET_ADMIN # tap device + bridge creation, see internal/compute-agent/netsetup
    # cgroupfs is mounted read-only for any non-privileged container
    # regardless of individual capabilities (confirmed: SYS_ADMIN alone did
    # not make it writable) -- needed for internal/compute-agent/cgroup's
    # delegation to work. compute-agent already runs as a highly-trusted,
    # full-root process with /dev/kvm/NET_ADMIN, so this is a small marginal
    # increase for playground purposes only.
    privileged: true
    # So that `nsenter --net=/proc/1/ns/net` (internal/compute-agent/iscsi,
    # docker/compute-agent-entrypoint.sh) via /proc/1 actually reaches the
    # *host's* network namespace, not just this container's own: a real
    # iSCSI login's kernel session creation (a NETLINK_ISCSI socket)
    # doesn't work from inside a container's own network namespace at all
    # -- see internal/compute-agent/iscsi's package doc comment for the
    # full story.
    pid: host
    # A successful iSCSI login creates a real host-level block device node
    # (/dev/disk/by-path/...), not a container-local one (see
    # internal/compute-agent/iscsi's package doc comment) -- bind-mounting
    # the host's actual /dev is what makes that node (and /dev/kvm,
    # /dev/net/tun, previously listed individually under `devices:`) show
    # up inside this container at all, so Firecracker/QEMU (running inside
    # it) can open it as a drive.
    volumes:
      - /dev:/dev
    depends_on:
      nats:
        condition: service_healthy
      compute:
        condition: service_started
