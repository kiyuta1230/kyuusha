# Multi-hypervisor playground: one NATS/JetStream broker, api-gateway (the
# only client-facing, JWT/OPA-checked entrypoint), one compute control-plane,
# one identity control-plane, one image control-plane, one network
# control-plane, and one block-storage control-plane (none exposed to the
# host -- only api-gateway may reach them; see docs/specs/network.md and
# docs/specs/volume.md), and three compute-agent
# "hypervisors" that self-register with compute at startup, so the real
# scheduler (Ready phase + driver + capacity + zone filters, most-available-
# first pick) has real inventory to spread VMs across. compute-agent boots
# real Firecracker microVMs (see docs/specs/firecracker-boot.md) using
# kernel/rootfs served by image-assets, and needs /dev/kvm passed through --
# if the host doesn't have KVM (or your user can't access /dev/kvm), this
# will fail to boot the actual guest but everything else in the stack still
# works. A VM created with network_interfaces also gets a real tap device
# wired to a local Linux bridge (see internal/compute-agent/netsetup and
# docs/specs/network.md); that needs /dev/net/tun and CAP_NET_ADMIN, same
# "fails gracefully, rest of the stack is unaffected" caveat as /dev/kvm.
# Bring it up with
# `docker compose -f playground/docker-compose.yml up -d --build` (from the
# repo root) and drive it with playground/scenario.sh or
# `go run ./cmd/kyuusha vm|tenant|hypervisor|image|subnet|netif|volume|volattach ...
# -addr=localhost:8080 -token=...` (`kyuusha token mint` for a dev token).
#
# Also brings up Jaeger (traces), Prometheus (metrics), Loki+Promtail (logs,
# including the audit trail -- see internal/audit and
# docs/specs/audit-logging.md), and Grafana (dashboards over all three,
# pre-provisioned as datasources) -- see docs/specs/observability-tracing.md
# and observability-metrics.md.
name: kyuusha-playground

services:
  nats:
    image: nats:2-alpine
    # -sd + the volume below: without an explicit store dir, JetStream
    # (streams, durable consumers' read position, any queued/unacked
    # message) lives only in this container's own writable layer -- a plain
    # process restart preserves that, but a container recreation (e.g. `up
    # --build` after an image change, or a host reboot) would silently wipe
    # it, unlike etcd's own data (see the etcd-data volume below, which
    # exists for exactly this reason). Not load-bearing for correctness --
    # every consumer here treats etcd, not NATS, as the source of truth and
    # rebuilds/resends whatever it needs from etcd on a sweep interval (see
    # docs/architecture.md and this session's crash-safety work) -- but
    # losing it still means waiting out that sweep interval instead of
    # resuming instantly, so there's no reason not to persist it too.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    ports:
      - "4222:4222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Backing store for every resource.Store (see docs/architecture.md
  # "採用: バッキングストアにetcdを採用する") -- a single member here, not a
  # real cluster (that's a production-deployment concern, not this
  # playground's). --auto-compaction-mode=periodic is the one real
  # requirement called out in that doc: without it, kyuusha's heartbeat-
  # heavy write pattern accumulates MVCC history until etcd's default 2GB
  # quota is hit.
  etcd:
    image: gcr.io/etcd-development/etcd:v3.5.17
    command:
      - etcd
      - "--data-dir=/etcd-data"
      - "--listen-client-urls=http://0.0.0.0:2379"
      - "--advertise-client-urls=http://etcd:2379"
      - "--listen-peer-urls=http://0.0.0.0:2380"
      - "--initial-advertise-peer-urls=http://etcd:2380"
      - "--initial-cluster=default=http://etcd:2380"
      - "--auto-compaction-mode=periodic"
      - "--auto-compaction-retention=1h"
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 2s
      timeout: 2s
      retries: 15

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:3.3.2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger
      - loki

  compute:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: compute
    command:
      - "-nats-url=nats://nats:4222"
      - "-etcd-endpoints=etcd:2379"
      - "-grpc-addr=:8081"
      - "-identity-addr=identity:8082"
      - "-image-addr=image:8083"
      - "-network-addr=network:8084"
      - "-block-storage-addr=block-storage:8085"
      - "-metrics-addr=:9092"
      - "-otlp-endpoint=jaeger:4317"
    depends_on:
      nats:
        condition: service_healthy
      etcd:
        condition: service_healthy
      identity:
        condition: service_started
      image:
        condition: service_started
      network:
        condition: service_started
      block-storage:
        condition: service_started
      jaeger:
        condition: service_started
    # No ports exposed to the host: api-gateway is the only client-facing
    # entrypoint. compute is reachable only from inside the compose network
    # (compute-agent also reaches it directly here, for Hypervisor
    # self-registration -- that's east-west traffic, not through api-gateway).

  identity:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: identity
    command:
      - "-grpc-addr=:8082"
      - "-etcd-endpoints=etcd:2379"
      - "-metrics-addr=:9091"
      - "-otlp-endpoint=jaeger:4317"
    depends_on:
      etcd:
        condition: service_healthy
      jaeger:
        condition: service_started
    # No ports exposed to the host: same reasoning as compute above.

  image:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: image
    command:
      - "-grpc-addr=:8083"
      - "-etcd-endpoints=etcd:2379"
      - "-metrics-addr=:9095"
      - "-otlp-endpoint=jaeger:4317"
    depends_on:
      etcd:
        condition: service_healthy
      jaeger:
        condition: service_started
    # No ports exposed to the host: same reasoning as compute above.

  network:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: network
    command:
      - "-grpc-addr=:8084"
      - "-etcd-endpoints=etcd:2379"
      - "-metrics-addr=:9096"
      - "-otlp-endpoint=jaeger:4317"
    depends_on:
      etcd:
        condition: service_healthy
      jaeger:
        condition: service_started
    # No ports exposed to the host: same reasoning as compute above.

  block-storage:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: block-storage
    command:
      - "-grpc-addr=:8085"
      - "-nats-url=nats://nats:4222"
      - "-etcd-endpoints=etcd:2379"
      - "-identity-addr=identity:8082"
      - "-metrics-addr=:9097"
      - "-otlp-endpoint=jaeger:4317"
    depends_on:
      nats:
        condition: service_healthy
      etcd:
        condition: service_healthy
      identity:
        condition: service_started
      jaeger:
        condition: service_started
    # No ports exposed to the host: same reasoning as compute above.

  api-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api-gateway
    command:
      - "-listen-addr=:8080"
      - "-compute-addr=compute:8081"
      - "-identity-addr=identity:8082"
      - "-image-addr=image:8083"
      - "-network-addr=network:8084"
      - "-block-storage-addr=block-storage:8085"
      - "-metrics-addr=:9093"
      - "-otlp-endpoint=jaeger:4317"
    depends_on:
      - compute
      - identity
      - image
      - network
      - block-storage
      - jaeger
    ports:
      - "8080:8080"

  # Prebuilt Firecracker kernel + rootfs for the playground's real microVM
  # boot milestone (see docs/specs/firecracker-boot.md), served over plain
  # HTTP so compute-agent can fetch them as ordinary Image artifact URLs --
  # not reachable from the host, only from compute-agent containers.
  image-assets:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: image-assets-server

  compute-agent-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: compute-agent
    command:
      - "-nats-url=nats://nats:4222"
      - "-compute-addr=compute:8081"
      - "-hypervisor=hypervisor-1"
      - "-drivers=FIRECRACKER,CLOUD_HYPERVISOR"
      - "-storage-connections=playground-nfs:/mnt/kyuusha-volumes"
      - "-metrics-addr=:9094"
      - "-otlp-endpoint=jaeger:4317"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN # tap device + bridge creation, see internal/compute-agent/netsetup
    # cgroupfs is mounted read-only for any non-privileged container
    # regardless of individual capabilities (confirmed: SYS_ADMIN alone did
    # not make it writable) -- needed for internal/compute-agent/cgroup's
    # delegation to work. compute-agent already runs as a highly-trusted,
    # full-root process with /dev/kvm/NET_ADMIN, so this is a small marginal
    # increase for playground purposes only.
    privileged: true
    # /mnt/kyuusha-volumes is this Hypervisor's one "playground-nfs" storage
    # connection (see the -storage-connections flag above and
    # internal/compute-agent/volumeref): a plain host directory standing in
    # for a real NFS export, bind-mounted identically into all three
    # compute-agent containers -- exactly NFS's own "every Hypervisor
    # mounts the same thing" shape (see docs/architecture.md「訂正: 責務の境界
    # を...」), just without an actual NFS server. Files under it must
    # already exist (and be world-read-write, since kyuusha never chowns a
    # bind-mounted Volume file -- see fcvmm/jailer.go's placeVolumeLike)
    # before any Volume referencing them is created -- scenario.sh plays
    # the "operator" role that would do this for real, per this design's
    # own responsibility boundary.
    volumes:
      - ${PWD}/playground/volume-data:/mnt/kyuusha-volumes
    depends_on:
      nats:
        condition: service_healthy
      compute:
        condition: service_started

  compute-agent-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: compute-agent
    command:
      - "-nats-url=nats://nats:4222"
      - "-compute-addr=compute:8081"
      - "-hypervisor=hypervisor-2"
      - "-drivers=FIRECRACKER,CLOUD_HYPERVISOR"
      - "-storage-connections=playground-nfs:/mnt/kyuusha-volumes"
      - "-metrics-addr=:9094"
      - "-otlp-endpoint=jaeger:4317"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN # tap device + bridge creation, see internal/compute-agent/netsetup
    # cgroupfs is mounted read-only for any non-privileged container
    # regardless of individual capabilities (confirmed: SYS_ADMIN alone did
    # not make it writable) -- needed for internal/compute-agent/cgroup's
    # delegation to work. compute-agent already runs as a highly-trusted,
    # full-root process with /dev/kvm/NET_ADMIN, so this is a small marginal
    # increase for playground purposes only.
    privileged: true
    # /mnt/kyuusha-volumes is this Hypervisor's one "playground-nfs" storage
    # connection (see the -storage-connections flag above and
    # internal/compute-agent/volumeref): a plain host directory standing in
    # for a real NFS export, bind-mounted identically into all three
    # compute-agent containers -- exactly NFS's own "every Hypervisor
    # mounts the same thing" shape (see docs/architecture.md「訂正: 責務の境界
    # を...」), just without an actual NFS server. Files under it must
    # already exist (and be world-read-write, since kyuusha never chowns a
    # bind-mounted Volume file -- see fcvmm/jailer.go's placeVolumeLike)
    # before any Volume referencing them is created -- scenario.sh plays
    # the "operator" role that would do this for real, per this design's
    # own responsibility boundary.
    volumes:
      - ${PWD}/playground/volume-data:/mnt/kyuusha-volumes
    depends_on:
      nats:
        condition: service_healthy
      compute:
        condition: service_started

  compute-agent-3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: compute-agent
    command:
      - "-nats-url=nats://nats:4222"
      - "-compute-addr=compute:8081"
      - "-hypervisor=hypervisor-3"
      - "-drivers=FIRECRACKER,CLOUD_HYPERVISOR"
      - "-storage-connections=playground-nfs:/mnt/kyuusha-volumes"
      - "-metrics-addr=:9094"
      - "-otlp-endpoint=jaeger:4317"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN # tap device + bridge creation, see internal/compute-agent/netsetup
    # cgroupfs is mounted read-only for any non-privileged container
    # regardless of individual capabilities (confirmed: SYS_ADMIN alone did
    # not make it writable) -- needed for internal/compute-agent/cgroup's
    # delegation to work. compute-agent already runs as a highly-trusted,
    # full-root process with /dev/kvm/NET_ADMIN, so this is a small marginal
    # increase for playground purposes only.
    privileged: true
    # /mnt/kyuusha-volumes is this Hypervisor's one "playground-nfs" storage
    # connection (see the -storage-connections flag above and
    # internal/compute-agent/volumeref): a plain host directory standing in
    # for a real NFS export, bind-mounted identically into all three
    # compute-agent containers -- exactly NFS's own "every Hypervisor
    # mounts the same thing" shape (see docs/architecture.md「訂正: 責務の境界
    # を...」), just without an actual NFS server. Files under it must
    # already exist (and be world-read-write, since kyuusha never chowns a
    # bind-mounted Volume file -- see fcvmm/jailer.go's placeVolumeLike)
    # before any Volume referencing them is created -- scenario.sh plays
    # the "operator" role that would do this for real, per this design's
    # own responsibility boundary.
    volumes:
      - ${PWD}/playground/volume-data:/mnt/kyuusha-volumes
    depends_on:
      nats:
        condition: service_healthy
      compute:
        condition: service_started

volumes:
  # Survives `docker compose down` (not `down -v`) -- see docs/architecture.md
  # "採用: バッキングストアにetcdを採用する". Without this, etcd's data lives
  # only in the container's own writable layer, which a plain `restart`
  # preserves but a container recreation (e.g. `up --build` after an image
  # change) would silently wipe -- exactly the persistence gap this whole
  # migration exists to close.
  etcd-data:
  nats-data:
