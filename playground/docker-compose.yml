# Multi-hypervisor playground: one NATS/JetStream broker, api-gateway (the
# only client-facing, JWT/OPA-checked entrypoint), one compute control-plane,
# one identity control-plane, one image control-plane, and one network
# control-plane (none exposed to the host -- only api-gateway may reach
# them; see docs/specs/network.md), and three compute-agent
# "hypervisors" that self-register with compute at startup, so the real
# scheduler (Ready phase + driver + capacity + zone filters, most-available-
# first pick) has real inventory to spread VMs across. compute-agent boots
# real Firecracker microVMs (see docs/specs/firecracker-boot.md) using
# kernel/rootfs served by image-assets, and needs /dev/kvm passed through --
# if the host doesn't have KVM (or your user can't access /dev/kvm), this
# will fail to boot the actual guest but everything else in the stack still
# works. A VM created with network_interfaces also gets a real tap device
# wired to a local Linux bridge (see internal/compute-agent/netsetup and
# docs/specs/network.md); that needs /dev/net/tun and CAP_NET_ADMIN, same
# "fails gracefully, rest of the stack is unaffected" caveat as /dev/kvm.
# Bring it up with
# `docker compose -f playground/docker-compose.yml up -d --build` (from the
# repo root) and drive it with playground/scenario.sh or
# `go run ./cmd/kyuusha vm|tenant|hypervisor|image|subnet|netif ...
# -addr=localhost:8080 -token=...` (`kyuusha token mint` for a dev token).
#
# Also brings up Jaeger (traces), Prometheus (metrics), Loki+Promtail (logs,
# including the audit trail -- see internal/audit and
# docs/specs/audit-logging.md), and Grafana (dashboards over all three,
# pre-provisioned as datasources) -- see docs/specs/observability-tracing.md
# and observability-metrics.md.
name: kyuusha-playground

services:
  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:3.3.2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger
      - loki

  compute:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: compute
    command:
      - "-nats-url=nats://nats:4222"
      - "-grpc-addr=:8081"
      - "-identity-addr=identity:8082"
      - "-image-addr=image:8083"
      - "-network-addr=network:8084"
      - "-metrics-addr=:9092"
      - "-otlp-endpoint=jaeger:4317"
    depends_on:
      nats:
        condition: service_healthy
      identity:
        condition: service_started
      image:
        condition: service_started
      network:
        condition: service_started
      jaeger:
        condition: service_started
    # No ports exposed to the host: api-gateway is the only client-facing
    # entrypoint. compute is reachable only from inside the compose network
    # (compute-agent also reaches it directly here, for Hypervisor
    # self-registration -- that's east-west traffic, not through api-gateway).

  identity:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: identity
    command:
      - "-grpc-addr=:8082"
      - "-metrics-addr=:9091"
      - "-otlp-endpoint=jaeger:4317"
    depends_on:
      jaeger:
        condition: service_started
    # No ports exposed to the host: same reasoning as compute above.

  image:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: image
    command:
      - "-grpc-addr=:8083"
      - "-metrics-addr=:9095"
      - "-otlp-endpoint=jaeger:4317"
    depends_on:
      jaeger:
        condition: service_started
    # No ports exposed to the host: same reasoning as compute above.

  network:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: network
    command:
      - "-grpc-addr=:8084"
      - "-metrics-addr=:9096"
      - "-otlp-endpoint=jaeger:4317"
    depends_on:
      jaeger:
        condition: service_started
    # No ports exposed to the host: same reasoning as compute above.

  api-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api-gateway
    command:
      - "-listen-addr=:8080"
      - "-compute-addr=compute:8081"
      - "-identity-addr=identity:8082"
      - "-image-addr=image:8083"
      - "-network-addr=network:8084"
      - "-metrics-addr=:9093"
      - "-otlp-endpoint=jaeger:4317"
    depends_on:
      - compute
      - identity
      - image
      - network
      - jaeger
    ports:
      - "8080:8080"

  # Prebuilt Firecracker kernel + rootfs for the playground's real microVM
  # boot milestone (see docs/specs/firecracker-boot.md), served over plain
  # HTTP so compute-agent can fetch them as ordinary Image artifact URLs --
  # not reachable from the host, only from compute-agent containers.
  image-assets:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: image-assets-server

  compute-agent-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: compute-agent
    command:
      - "-nats-url=nats://nats:4222"
      - "-compute-addr=compute:8081"
      - "-hypervisor=hypervisor-1"
      - "-zone=zone-a"
      - "-metrics-addr=:9094"
      - "-otlp-endpoint=jaeger:4317"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN # tap device + bridge creation, see internal/compute-agent/netsetup
    depends_on:
      nats:
        condition: service_healthy
      compute:
        condition: service_started

  compute-agent-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: compute-agent
    command:
      - "-nats-url=nats://nats:4222"
      - "-compute-addr=compute:8081"
      - "-hypervisor=hypervisor-2"
      - "-zone=zone-a"
      - "-metrics-addr=:9094"
      - "-otlp-endpoint=jaeger:4317"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN # tap device + bridge creation, see internal/compute-agent/netsetup
    depends_on:
      nats:
        condition: service_healthy
      compute:
        condition: service_started

  compute-agent-3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: compute-agent
    command:
      - "-nats-url=nats://nats:4222"
      - "-compute-addr=compute:8081"
      - "-hypervisor=hypervisor-3"
      - "-zone=zone-a"
      - "-metrics-addr=:9094"
      - "-otlp-endpoint=jaeger:4317"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN # tap device + bridge creation, see internal/compute-agent/netsetup
    depends_on:
      nats:
        condition: service_healthy
      compute:
        condition: service_started
