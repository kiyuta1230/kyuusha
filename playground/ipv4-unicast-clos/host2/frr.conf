frr version 10.5.1
frr defaults traditional
hostname host2
no ipv6 forwarding
!
interface eth1
!
router bgp 65002
 bgp router-id 10.255.0.2
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor eth1 interface remote-as external
 !
 address-family ipv4 unicast
  redistribute static
  neighbor eth1 activate
 exit-address-family
!
line vty
!
