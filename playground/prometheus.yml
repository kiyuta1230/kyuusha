global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:9093"]
  - job_name: compute
    static_configs:
      - targets: ["compute:9092"]
  - job_name: identity
    static_configs:
      - targets: ["identity:9091"]
  - job_name: image
    static_configs:
      - targets: ["image:9095"]
  - job_name: network
    static_configs:
      - targets: ["network:9096"]
  - job_name: block-storage
    static_configs:
      - targets: ["block-storage:9097"]
  - job_name: compute-reconciler
    static_configs:
      - targets: ["compute-reconciler:9098"]
  - job_name: network-reconciler
    static_configs:
      - targets: ["network-reconciler:9099"]
  - job_name: block-storage-reconciler
    static_configs:
      - targets: ["block-storage-reconciler:9100"]
  - job_name: compute-agent
    static_configs:
      - targets: ["compute-agent-1:9094", "compute-agent-2:9094", "compute-agent-3:9094"]
  # VM resource metrics (CPU/memory from cgroup) -- a separate endpoint from
  # compute-agent's own /metrics, see docs/specs/observability-metrics.md
  # "/metrics/resources" and docs/architecture.md「払い出したリソース自身の
  # メトリクス」.
  - job_name: compute-agent-resources
    metrics_path: /metrics/resources
    static_configs:
      - targets: ["compute-agent-1:9094", "compute-agent-2:9094", "compute-agent-3:9094"]
