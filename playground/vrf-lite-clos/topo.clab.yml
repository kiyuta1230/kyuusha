name: vrf-lite-clos
topology:
  nodes:
    host1:
      kind: linux
      image: quay.io/frrouting/frr:10.5.1
      binds:
        - daemons:/etc/frr/daemons
        - host1/frr.conf:/etc/frr/frr.conf
      exec:
        - apk add --no-cache jq iputils
        - ip link add vrf01c9a2a0762a type vrf table 1000
        - ip link set vrf01c9a2a0762a up
        - ip link set eth1 master vrf01c9a2a0762a
        - ip link set eth1 up
    host2:
      kind: linux
      image: quay.io/frrouting/frr:10.5.1
      binds:
        - daemons:/etc/frr/daemons
        - host2/frr.conf:/etc/frr/frr.conf
      exec:
        - apk add --no-cache jq iputils
        - ip link add vrf01c9a2a0762a type vrf table 1000
        - ip link set vrf01c9a2a0762a up
        - ip link set eth1 master vrf01c9a2a0762a
        - ip link set eth1 up
    leaf1:
      kind: linux
      image: quay.io/frrouting/frr:10.5.1
      binds:
        - daemons:/etc/frr/daemons
        - leaf1/frr.conf:/etc/frr/frr.conf
      exec:
        - ip link add vrf01c9a2a0762a type vrf table 1000
        - ip link set vrf01c9a2a0762a up
        - ip link set eth1 master vrf01c9a2a0762a
        - ip link set eth1 up
        - ip link set eth2 master vrf01c9a2a0762a
        - ip link set eth2 up
    leaf2:
      kind: linux
      image: quay.io/frrouting/frr:10.5.1
      binds:
        - daemons:/etc/frr/daemons
        - leaf2/frr.conf:/etc/frr/frr.conf
      exec:
        - ip link add vrf01c9a2a0762a type vrf table 1000
        - ip link set vrf01c9a2a0762a up
        - ip link set eth1 master vrf01c9a2a0762a
        - ip link set eth1 up
        - ip link set eth2 master vrf01c9a2a0762a
        - ip link set eth2 up
    spine:
      kind: linux
      image: quay.io/frrouting/frr:10.5.1
      binds:
        - daemons:/etc/frr/daemons
        - spine/frr.conf:/etc/frr/frr.conf
      exec:
        - ip link add vrf01c9a2a0762a type vrf table 1000
        - ip link set vrf01c9a2a0762a up
        - ip link set eth1 master vrf01c9a2a0762a
        - ip link set eth1 up
        - ip link set eth2 master vrf01c9a2a0762a
        - ip link set eth2 up
  links:
    - endpoints: ["host1:eth1", "leaf1:eth1"]
    - endpoints: ["leaf1:eth2", "spine:eth1"]
    - endpoints: ["spine:eth2", "leaf2:eth1"]
    - endpoints: ["leaf2:eth2", "host2:eth1"]
