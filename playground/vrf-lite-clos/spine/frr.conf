frr version 10.5.1
frr defaults traditional
hostname spine
no ipv6 forwarding
!
vrf vrf01c9a2a0762a
exit-vrf
!
interface eth1
 ip address 10.0.2.2/30
!
interface eth2
 ip address 10.0.3.1/30
!
router bgp 65021 vrf vrf01c9a2a0762a
 bgp router-id 10.255.2.1
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 10.0.2.1 remote-as 65011
 neighbor 10.0.3.2 remote-as 65012
 !
 address-family ipv4 unicast
 exit-address-family
!
line vty
!
