frr version 10.5.1
frr defaults traditional
hostname host2
no ipv6 forwarding
!
vrf vrf01c9a2a0762a
exit-vrf
!
interface eth1
 ip address 10.0.4.2/30
!
router bgp 65002 vrf vrf01c9a2a0762a
 bgp router-id 10.255.0.2
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 10.0.4.1 remote-as 65012
 !
 address-family ipv4 unicast
  redistribute static
 exit-address-family
!
line vty
!
