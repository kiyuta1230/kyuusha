# Multi-hypervisor playground: one NATS/JetStream broker, api-gateway (the
# only client-facing, JWT/OPA-checked entrypoint), one compute control-plane
# and one identity control-plane (neither exposed to the host -- only
# api-gateway may reach them), and three compute-agent "hypervisors" so the
# (still-stub) round-robin scheduler has something to spread VMs across.
# Bring it up with `docker compose up --build` and drive it with
# playground/scenario.sh or `go run ./cmd/kyuusha vm|tenant ...
# -addr=localhost:8080 -token=...` (`kyuusha token mint` for a dev token).
name: kyuusha-playground

services:
  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

  compute:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: compute
    command:
      - "-nats-url=nats://nats:4222"
      - "-grpc-addr=:8081"
      - "-identity-addr=identity:8082"
      - "-hypervisors=hypervisor-1,hypervisor-2,hypervisor-3"
    depends_on:
      nats:
        condition: service_healthy
      identity:
        condition: service_started
    # No ports exposed to the host: api-gateway is the only client-facing
    # entrypoint. compute is reachable only from inside the compose network.

  identity:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: identity
    command:
      - "-grpc-addr=:8082"
    # No ports exposed to the host: same reasoning as compute above.

  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api-gateway
    command:
      - "-listen-addr=:8080"
      - "-compute-addr=compute:8081"
      - "-identity-addr=identity:8082"
    depends_on:
      - compute
      - identity
    ports:
      - "8080:8080"

  compute-agent-1:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: compute-agent
    command: ["-nats-url=nats://nats:4222", "-hypervisor=hypervisor-1"]
    depends_on:
      nats:
        condition: service_healthy

  compute-agent-2:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: compute-agent
    command: ["-nats-url=nats://nats:4222", "-hypervisor=hypervisor-2"]
    depends_on:
      nats:
        condition: service_healthy

  compute-agent-3:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: compute-agent
    command: ["-nats-url=nats://nats:4222", "-hypervisor=hypervisor-3"]
    depends_on:
      nats:
        condition: service_healthy
