# Multi-hypervisor playground: one NATS/JetStream broker, api-gateway (the
# only client-facing, JWT/OPA-checked entrypoint), one compute control-plane
# and one identity control-plane (neither exposed to the host -- only
# api-gateway may reach them), and three compute-agent "hypervisors" that
# self-register with compute at startup, so the real scheduler (Ready phase +
# driver + capacity filters, most-available-first pick) has real inventory to
# spread VMs across. Bring it up with `docker compose up --build` and drive
# it with playground/scenario.sh or `go run ./cmd/kyuusha vm|tenant|hypervisor
# ... -addr=localhost:8080 -token=...` (`kyuusha token mint` for a dev token).
#
# Also brings up Jaeger (traces), Prometheus (metrics), and Grafana
# (dashboards over both, pre-provisioned as datasources) -- see
# docs/specs/observability-tracing.md and observability-metrics.md.
name: kyuusha-playground

services:
  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./playground/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./playground/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger

  compute:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: compute
    command:
      - "-nats-url=nats://nats:4222"
      - "-grpc-addr=:8081"
      - "-identity-addr=identity:8082"
      - "-metrics-addr=:9092"
      - "-otlp-endpoint=jaeger:4317"
    depends_on:
      nats:
        condition: service_healthy
      identity:
        condition: service_started
      jaeger:
        condition: service_started
    # No ports exposed to the host: api-gateway is the only client-facing
    # entrypoint. compute is reachable only from inside the compose network
    # (compute-agent also reaches it directly here, for Hypervisor
    # self-registration -- that's east-west traffic, not through api-gateway).

  identity:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: identity
    command:
      - "-grpc-addr=:8082"
      - "-metrics-addr=:9091"
      - "-otlp-endpoint=jaeger:4317"
    depends_on:
      jaeger:
        condition: service_started
    # No ports exposed to the host: same reasoning as compute above.

  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api-gateway
    command:
      - "-listen-addr=:8080"
      - "-compute-addr=compute:8081"
      - "-identity-addr=identity:8082"
      - "-metrics-addr=:9093"
      - "-otlp-endpoint=jaeger:4317"
    depends_on:
      - compute
      - identity
      - jaeger
    ports:
      - "8080:8080"

  compute-agent-1:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: compute-agent
    command:
      - "-nats-url=nats://nats:4222"
      - "-compute-addr=compute:8081"
      - "-hypervisor=hypervisor-1"
      - "-zone=zone-a"
      - "-metrics-addr=:9094"
      - "-otlp-endpoint=jaeger:4317"
    depends_on:
      nats:
        condition: service_healthy
      compute:
        condition: service_started

  compute-agent-2:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: compute-agent
    command:
      - "-nats-url=nats://nats:4222"
      - "-compute-addr=compute:8081"
      - "-hypervisor=hypervisor-2"
      - "-zone=zone-a"
      - "-metrics-addr=:9094"
      - "-otlp-endpoint=jaeger:4317"
    depends_on:
      nats:
        condition: service_healthy
      compute:
        condition: service_started

  compute-agent-3:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: compute-agent
    command:
      - "-nats-url=nats://nats:4222"
      - "-compute-addr=compute:8081"
      - "-hypervisor=hypervisor-3"
      - "-zone=zone-a"
      - "-metrics-addr=:9094"
      - "-otlp-endpoint=jaeger:4317"
    depends_on:
      nats:
        condition: service_healthy
      compute:
        condition: service_started
