syntax = "proto3";

package kyuusha.blockstorage.v1;

option go_package = "gitlab.com/ki.yuta1230/kyuusha/gen/go/kyuusha/blockstorage/v1;blockstoragev1";

import "google/protobuf/empty.proto";
import "kyuusha/resource/v1/common.proto";

// See docs/architecture.md "block-storageサービスのリソース: Volume / VolumeAttachment".
// Volume is a standalone resource that can outlive any single VirtualMachine;
// VolumeAttachment represents the (temporary) binding between one Volume and
// one VirtualMachine -- the same "make the binding itself a resource"
// pattern as network's NetworkInterface.
//
// kyuusha does not provision or export storage itself (see docs/architecture.md
// "block-storageのバックエンド抽象化"「訂正: 責務の境界を...」): a Volume is a
// *reference* to a block device or file that already exists and is already
// reachable from whichever Hypervisors declared the matching
// storage_connection at registration time (see docs/specs/volume.md). The
// operator provisions and connects storage using whatever tooling fits their
// backend (ZFS/Ceph/a SAN vendor's own API/a shared NFS export); kyuusha's
// job starts at referencing and attaching what's already there.
enum StorageProtocol {
  STORAGE_PROTOCOL_UNSPECIFIED = 0;
  ISCSI = 1;
  NVME_OF = 2;
  NFS = 3;
}

message VolumeSpec {
  int64 size_gb = 1; // self-reported (kyuusha never provisions, so it can't verify this) -- used for quota only
  StorageProtocol protocol = 2;
  // storage_connection names the Hypervisor-side connection this Volume
  // lives behind -- must match a name a Hypervisor declared in its own
  // -storage-connections at registration (docs/specs/hypervisor-bootstrap.md).
  // Plain string match, not its own CRUD resource (this system's expected
  // volume/connection count is small enough that the extra indirection
  // isn't worth it yet).
  string storage_connection = 3;
  // identifier is protocol-specific: for ISCSI/NVME_OF, the block device's
  // stable serial/WWN (as seen under /dev/disk/by-id/ once the Hypervisor's
  // storage_connection session makes it visible); for NFS, a file path
  // relative to wherever that Hypervisor mounted the connection.
  string identifier = 4;
  // annotations is never interpreted by kyuusha itself -- purely a
  // reference field for admins/users (e.g. a QoS tier). Same role as
  // Kubernetes' annotations (not labels: nothing selects on this).
  map<string, string> annotations = 5;
}

message VolumeStatus {
  // phase is Pending until (1) the referenced StorageConnection
  // (storageconnection.proto) is itself Ready, and (2) this Volume's own
  // identifier has been confirmed to exist (with a real observed size) by
  // some Hypervisor holding that connection -- see docs/open-questions.md
  //「Volumeの申告内容...」「Hypervisor↔ストレージバックエンドの接続確立を
  // kyuusha側で自動化すべきか」. Never Error, by the same strict-but-patient
  // design as StorageConnection: an unverified Volume just stays Pending.
  string phase = 1; // Pending / Ready / Deleting
  repeated kyuusha.resource.v1.Condition conditions = 2;
}

message Volume {
  kyuusha.resource.v1.ObjectMeta meta = 1;
  VolumeSpec spec = 2;
  VolumeStatus status = 3;
}

message CreateVolumeRequest {
  string tenant_id = 1;
  string name = 2; // idempotency key: a repeated Create with the same (tenant_id, name) returns the existing Volume
  VolumeSpec spec = 3;
  bool dry_run = 4;
}

message GetVolumeRequest {
  string tenant_id = 1;
  string id = 2;
}

message ListVolumesRequest {
  string tenant_id = 1;
}

message ListVolumesResponse {
  repeated Volume items = 1;
}

message DeleteVolumeRequest {
  string tenant_id = 1;
  string id = 2;
  bool dry_run = 3;
}

message WatchVolumesRequest {
  string tenant_id = 1;
  int64 since_resource_version = 2;
}

message VolumeEvent {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    ADDED = 1;
    MODIFIED = 2;
    DELETED = 3;
    BOOKMARK = 4;
  }
  Type type = 1;
  Volume volume = 2;
  int64 resource_version = 3;
}

service VolumeService {
  rpc Create(CreateVolumeRequest) returns (Volume);
  rpc Get(GetVolumeRequest) returns (Volume);
  rpc List(ListVolumesRequest) returns (ListVolumesResponse);
  rpc Delete(DeleteVolumeRequest) returns (google.protobuf.Empty);
  rpc Watch(WatchVolumesRequest) returns (stream VolumeEvent);
}

message VolumeAttachmentSpec {
  string volume_id = 1;
  string vm_id = 2;
  string device_hint = 3; // 省略可
}

message VolumeAttachmentStatus {
  string phase = 1; // Pending(排他制御待ち) / Attached / Deleting / Error
  repeated kyuusha.resource.v1.Condition conditions = 2;
  string device_path = 3; // compute-agent側でのローカルデバイスパス（まだ報告経路が無く常に空。既知の未実装事項）
  string hypervisor = 4;  // まだ空（VolumeAttachmentSpecにhypervisorを持たせていないため。既知の未実装事項）
}

message VolumeAttachment {
  kyuusha.resource.v1.ObjectMeta meta = 1;
  VolumeAttachmentSpec spec = 2;
  VolumeAttachmentStatus status = 3;
}

message CreateVolumeAttachmentRequest {
  string tenant_id = 1;
  string name = 2; // idempotency key
  VolumeAttachmentSpec spec = 3;
  bool dry_run = 4;
}

message GetVolumeAttachmentRequest {
  string tenant_id = 1;
  string id = 2;
}

message ListVolumeAttachmentsRequest {
  string tenant_id = 1;
}

message ListVolumeAttachmentsResponse {
  repeated VolumeAttachment items = 1;
}

message DeleteVolumeAttachmentRequest {
  string tenant_id = 1;
  string id = 2;
  bool dry_run = 3;
}

message WatchVolumeAttachmentsRequest {
  string tenant_id = 1;
  int64 since_resource_version = 2;
}

message VolumeAttachmentEvent {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    ADDED = 1;
    MODIFIED = 2;
    DELETED = 3;
    BOOKMARK = 4;
  }
  Type type = 1;
  VolumeAttachment volume_attachment = 2;
  int64 resource_version = 3;
}

service VolumeAttachmentService {
  rpc Create(CreateVolumeAttachmentRequest) returns (VolumeAttachment);
  rpc Get(GetVolumeAttachmentRequest) returns (VolumeAttachment);
  rpc List(ListVolumeAttachmentsRequest) returns (ListVolumeAttachmentsResponse);
  rpc Delete(DeleteVolumeAttachmentRequest) returns (google.protobuf.Empty);
  rpc Watch(WatchVolumeAttachmentsRequest) returns (stream VolumeAttachmentEvent);
}
