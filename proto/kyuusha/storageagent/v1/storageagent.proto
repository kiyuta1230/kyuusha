syntax = "proto3";

package kyuusha.storageagent.v1;

option go_package = "gitlab.com/ki.yuta1230/kyuusha/gen/go/kyuusha/storageagent/v1;storageagentv1";

import "google/protobuf/empty.proto";

// StorageBackendService is what internal/block-storage drives to actually
// realize a Volume, per docs/architecture.md's `StorageBackend` Go
// interface sketch -- storage-agent is the process that owns a real ZFS
// pool and an iSCSI target (LIO) on one storage node, analogous to how
// compute-agent owns one Hypervisor's real VMM processes. block-storage is
// the only client; this is internal-only (never registered with
// api-gateway), reached via a single static address (`-storage-agent-addr`)
// -- v1 assumes one storage node, no registration/scheduling across
// several (see docs/specs/volume.md).
//
// volume_id below is always kyuusha's own Volume.meta.id -- block-storage
// never lets storage-agent choose an identifier, mirroring how compute
// never lets compute-agent choose a VM's id.
service StorageBackendService {
  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse);
  rpc DeleteVolume(DeleteVolumeRequest) returns (google.protobuf.Empty);
  // ExportVolume makes volume_id reachable over iSCSI and returns the
  // connection info compute-agent's initiator needs. Idempotent: exporting
  // an already-exported volume_id returns the same target_iqn/portal
  // rather than erroring or creating a second export.
  rpc ExportVolume(ExportVolumeRequest) returns (ExportVolumeResponse);
  // UnexportVolume tears down the iSCSI export (but not the underlying
  // zvol -- see DeleteVolume for that). A no-op if volume_id was never
  // exported.
  rpc UnexportVolume(UnexportVolumeRequest) returns (google.protobuf.Empty);
}

message CreateVolumeRequest {
  string volume_id = 1;
  int64 size_gb = 2;
}

message CreateVolumeResponse {}

message DeleteVolumeRequest {
  string volume_id = 1;
}

message ExportVolumeRequest {
  string volume_id = 1;
}

message ExportVolumeResponse {
  string target_iqn = 1;
  string portal = 2; // "host:port"
}

message UnexportVolumeRequest {
  string volume_id = 1;
}
