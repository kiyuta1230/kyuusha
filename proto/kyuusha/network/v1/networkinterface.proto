syntax = "proto3";

package kyuusha.network.v1;

option go_package = "github.com/kiyuta1230/kyuusha/gen/go/kyuusha/network/v1;networkv1";

import "google/protobuf/empty.proto";
import "kyuusha/resource/v1/common.proto";

// See docs/architecture.md "networkサービスのリソース: Subnet / NetworkInterface"
// and docs/specs/network.md.

message NetworkInterfaceSpec {
  string vm_id = 1;
  // Optional: pin the interface to this Subnet. Empty: network_id+zone, and
  // kyuusha picks a Subnet of that Network in that zone with a free address
  // at allocation time (status.subnet_id). Set: network_id/zone are filled
  // in from the Subnet.
  string subnet_id = 2;
  reserved 3, 4; // ingress_rules/egress_rules, replaced by SecurityGroups
  string network_id = 5; // required unless subnet_id is set
  string zone = 6;       // required unless subnet_id is set
  // SecurityGroups attached to the interface (allow-only, union). Empty at
  // Create attaches the Network's default group; afterwards only
  // SetSecurityGroups changes it (an empty list there means deny all).
  repeated string security_group_ids = 7;
}

message NetworkInterfaceStatus {
  string phase = 1;    // Pending / Binding(IPAM割当+tap配線中) / Ready / Rebinding(SELF_HEAL再バインド中) / Deleting / Error
  repeated kyuusha.resource.v1.Condition conditions = 2;
  string ip_address = 3;
  string mac_address = 4;
  string hypervisor = 5; // the Hypervisor a tap is currently wired on, if any
  reserved 6, 7; // effective_ingress_rules/effective_egress_rules
  string subnet_id = 8; // the Subnet the address was allocated from (spec.subnet_id, or the one kyuusha picked)
}

message NetworkInterface {
  kyuusha.resource.v1.ObjectMeta meta = 1;
  NetworkInterfaceSpec spec = 2;
  NetworkInterfaceStatus status = 3;
}

message CreateNetworkInterfaceRequest {
  string tenant_id = 1;
  string name = 2; // idempotency key: a repeated Create with the same (tenant_id, name) returns the existing NetworkInterface
  NetworkInterfaceSpec spec = 3;
  bool dry_run = 4;
  // Become meta.labels/meta.annotations -- see kyuusha.resource.v1.ObjectMeta.
  map<string, string> labels = 5;
  map<string, string> annotations = 6;
}

message GetNetworkInterfaceRequest {
  string tenant_id = 1;
  string id = 2;
}

message ListNetworkInterfacesRequest {
  string tenant_id = 1;
}

message ListNetworkInterfacesResponse {
  repeated NetworkInterface items = 1;
}

message UpdateNetworkInterfaceRequest {
  NetworkInterface network_interface = 1; // .meta.resource_version must match the stored value
  bool dry_run = 2;
  string tenant_id = 3; // mirrors network_interface.meta.tenant_id; see vm.proto's UpdateVirtualMachineRequest for why this stays top-level
}

message SetSecurityGroupsRequest {
  string tenant_id = 1;
  string id = 2; // network_interface id
  // Replaces the attached groups wholesale; empty means none (deny all).
  repeated string security_group_ids = 3;
}

// SecurityPolicy is what a host enforces for one NetworkInterface: its
// SecurityGroups' rules, merged, with group/Network peers left as
// references to named address sets, plus a versioned snapshot of each set
// (see docs/specs/snap.md). Internal: compute reads it at boot; not served
// through api-gateway.
message SecurityPolicyRule {
  string protocol = 1;   // "" (any) / tcp / udp / icmp
  string port_range = 2; // "" = all ports
  string cidr = 3;       // exactly one of cidr/set
  string set = 4;        // "sg:<id>" / "network:<id>"
}
message AddressSet {
  string name = 1;
  int64 version = 2; // etcd revision the snapshot reflects
  repeated string members = 3;
}
message SecurityPolicy {
  repeated string security_group_ids = 1;
  repeated SecurityPolicyRule ingress_rules = 2;
  repeated SecurityPolicyRule egress_rules = 3;
  repeated AddressSet sets = 4;
}
message GetSecurityPolicyRequest {
  string tenant_id = 1;
  string id = 2; // network_interface id
}

message DeleteNetworkInterfaceRequest {
  string tenant_id = 1;
  string id = 2;
  bool dry_run = 3;
}

message WatchNetworkInterfacesRequest {
  string tenant_id = 1;
  int64 since_resource_version = 2;
}

message NetworkInterfaceEvent {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    ADDED = 1;
    MODIFIED = 2;
    DELETED = 3;
    BOOKMARK = 4;
  }
  Type type = 1;
  NetworkInterface network_interface = 2;
  int64 resource_version = 3;
}

service NetworkInterfaceService {
  rpc Create(CreateNetworkInterfaceRequest) returns (NetworkInterface);
  rpc Get(GetNetworkInterfaceRequest) returns (NetworkInterface);
  rpc List(ListNetworkInterfacesRequest) returns (ListNetworkInterfacesResponse);
  rpc Update(UpdateNetworkInterfaceRequest) returns (NetworkInterface);
  // SetSecurityGroups is the only way to change security_group_ids after
  // Create (Update rejects a change), so the host-side re-apply (see
  // docs/specs/snap.md) can't be bypassed.
  rpc SetSecurityGroups(SetSecurityGroupsRequest) returns (NetworkInterface);
  rpc GetSecurityPolicy(GetSecurityPolicyRequest) returns (SecurityPolicy);
  rpc Delete(DeleteNetworkInterfaceRequest) returns (google.protobuf.Empty);
  rpc Watch(WatchNetworkInterfacesRequest) returns (stream NetworkInterfaceEvent);
}
