syntax = "proto3";

package kyuusha.network.v1;

option go_package = "github.com/kiyuta1230/kyuusha/gen/go/kyuusha/network/v1;networkv1";

import "google/protobuf/empty.proto";
import "kyuusha/resource/v1/common.proto";

// See docs/architecture.md "networkサービスのリソース: Subnet / NetworkInterface"
// and docs/specs/network.md. A tenant (KaaS cluster) holds one or more
// Subnets, each independently issued a VLAN ID; a multi-homed cluster is
// expressed as multiple Subnets, not a separate "Network" grouping resource.

// SubnetVisibility mirrors kyuusha.image.v1.ImageVisibility exactly -- same
// three-tier access model (owner-only / owner+explicit allowlist / anyone),
// same meaning, same UNSPECIFIED-defaults-to-PRIVATE convention. See
// SubnetSpec.visibility/shared_with_tenant_ids and docs/specs/network.md.
enum SubnetVisibility {
  SUBNET_VISIBILITY_UNSPECIFIED = 0; // treated as PRIVATE
  PRIVATE = 1; // default: only the owning tenant, plus shared_with_tenant_ids
  // any tenant may attach a NetworkInterface to this Subnet;
  // shared_with_tenant_ids is then meaningless (ignored). Requires
  // unique_cidr=true (see below) -- open, unvetted cross-tenant L2 sharing
  // is only accepted on Public IP address space; an ordinary private
  // Subnet must use the narrower, owner-vetted shared_with_tenant_ids
  // instead (see docs/architecture.md「テナント間でのSubnet共有」).
  PUBLIC = 2;
}

message SubnetSpec {
  string zone = 1;                            // required: the Availability Zone this Subnet (VLAN) belongs to
  string cidr = 2;                            // required, e.g. "10.0.1.0/24"
  string gateway_ip = 3;
  repeated string dns_servers = 4;             // if empty and dns_suffix is set, kyuusha's shared resolver IP is implied
  // field 5 used to be shared_with_tenant_ids with a different, ACL-only
  // meaning (validateCrossTenantRules: cross-tenant firewall-rule reference
  // consent). Removed -- an equivalent or stronger policy is available by
  // wiring internal/admissionwebhook into this service instead of a bespoke
  // field (see docs/architecture.md). The name is reused below (field 11)
  // with a different meaning, matching kyuusha.image.v1's field of the same
  // name, so only the field *number* is reserved here, not the name.
  reserved 5;
  string dns_suffix = 6;                       // empty disables the (extension) name resolution feature
  string mesh_group = 7;                       // declares intent: Subnets sharing a non-empty value (same tenant only) are meant to default-allow each other, bypassing the normal cross-Subnet deny -- not enforced yet, no ACL engine exists (see docs/specs/network.md)
  repeated string allocatable_ip_ranges = 8;   // e.g. ["10.0.1.3-10.0.1.127", "10.0.1.136-10.0.1.254"]; empty means the whole cidr (minus network/broadcast/gateway_ip) is allocatable
  // unique_cidr declares that this Subnet's CIDR must not overlap any other
  // Subnet (any tenant) that also has unique_cidr=true -- checked at
  // Create/Update time. false (the default) keeps today's behavior: CIDR
  // overlap across different mesh_groups/tenants is fine (different
  // VRF/VLAN). Independent of visibility -- a Subnet can be Public IP
  // address space (unique_cidr=true) shared with everyone (visibility=PUBLIC),
  // shared with a few tenants (visibility=PRIVATE+shared_with_tenant_ids), or
  // exclusive to its own owner, and separately a plain private Subnet could
  // set unique_cidr=true for unrelated reasons. See docs/specs/network.md.
  bool unique_cidr = 9;
  SubnetVisibility visibility = 10; // default PRIVATE, mirrors ImageVisibility
  // shared_with_tenant_ids is meaningful only when visibility == PRIVATE:
  // tenants other than the owner who may actually attach a NetworkInterface
  // to this Subnet -- same field name and meaning as
  // kyuusha.image.v1.ImageSpec.shared_with_tenant_ids (NOT the old,
  // removed field 5, which only ever gated firewall-rule ACL references).
  // This is the *purposeful*, owner-vetted grant (the owning tenant names
  // each trusted tenant explicitly, e.g. injecting a managed-service
  // provider's VM directly into its own Subnet) -- unlike visibility=PUBLIC,
  // this works on any Subnet, not just unique_cidr ones, since the owner's
  // explicit per-tenant consent is itself the safeguard against the
  // unvetted L2-sharing risk docs/architecture.md warns about.
  repeated string shared_with_tenant_ids = 11;
}

message SubnetStatus {
  string phase = 1;    // Pending(VLAN未払い出し) / Ready / Deleting / Error
  repeated kyuusha.resource.v1.Condition conditions = 2;
  int32 vlan_id = 3;   // issued VLAN ID
}

message Subnet {
  kyuusha.resource.v1.ObjectMeta meta = 1;
  SubnetSpec spec = 2;
  SubnetStatus status = 3;
}

message CreateSubnetRequest {
  string tenant_id = 1;
  string name = 2; // idempotency key: a repeated Create with the same (tenant_id, name) returns the existing Subnet
  SubnetSpec spec = 3;
  bool dry_run = 4;
}

message GetSubnetRequest {
  string tenant_id = 1;
  string id = 2;
}

message ListSubnetsRequest {
  string tenant_id = 1;
}

message ListSubnetsResponse {
  repeated Subnet items = 1;
}

message UpdateSubnetRequest {
  Subnet subnet = 1; // subnet.meta.resource_version must match the stored value
  bool dry_run = 2;
  string tenant_id = 3; // mirrors subnet.meta.tenant_id; see vm.proto's UpdateVirtualMachineRequest for why this stays top-level
}

message DeleteSubnetRequest {
  string tenant_id = 1;
  string id = 2;
  bool dry_run = 3;
}

message WatchSubnetsRequest {
  string tenant_id = 1;
  int64 since_resource_version = 2;
}

message SubnetEvent {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    ADDED = 1;
    MODIFIED = 2;
    DELETED = 3;
    BOOKMARK = 4;
  }
  Type type = 1;
  Subnet subnet = 2;
  int64 resource_version = 3;
}

service SubnetService {
  rpc Create(CreateSubnetRequest) returns (Subnet);
  rpc Get(GetSubnetRequest) returns (Subnet);
  rpc List(ListSubnetsRequest) returns (ListSubnetsResponse);
  rpc Update(UpdateSubnetRequest) returns (Subnet);
  rpc Delete(DeleteSubnetRequest) returns (google.protobuf.Empty);
  rpc Watch(WatchSubnetsRequest) returns (stream SubnetEvent);
}
