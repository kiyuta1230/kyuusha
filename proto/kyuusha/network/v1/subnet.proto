syntax = "proto3";

package kyuusha.network.v1;

option go_package = "github.com/kiyuta1230/kyuusha/gen/go/kyuusha/network/v1;networkv1";

import "google/protobuf/empty.proto";
import "kyuusha/resource/v1/common.proto";
import "kyuusha/network/v1/network.proto";

// See docs/architecture.md "networkサービスのリソース: Subnet / NetworkInterface"
// and docs/specs/network.md. A tenant (KaaS cluster) holds one or more
// Subnets, each independently issued a VLAN ID; a multi-homed cluster is
// expressed as multiple Subnets, not a separate "Network" grouping resource.

// SubnetVisibility mirrors kyuusha.image.v1.ImageVisibility exactly -- same
// three-tier access model (owner-only / owner+explicit allowlist / anyone),
// same meaning, same UNSPECIFIED-defaults-to-PRIVATE convention. See
// SubnetSpec.visibility/shared_with_tenant_ids and docs/specs/network.md.
// SubnetAddress is one address family's CIDR and gateway.
message SubnetAddress {
  string cidr = 1;
  string gateway_ip = 2;
}

// The user-written half: what is being asked for. Everything allocated
// lives in status (system-written; Update never changes it).
message SubnetSpec {
  string network_id = 1; // required, immutable: the Network this Subnet belongs to
  string zone = 2;       // required, immutable: the Availability Zone
  // Only for a NetworkClass whose CIDR pool is user-specified (USER_ANY,
  // USER_WITHIN_BLOCKS): the requested CIDR (and optionally gateway) per
  // address family. Must be empty when the class allocates addresses.
  // Immutable.
  repeated SubnetAddress requested_addresses = 3;
  repeated string dns_servers = 4;           // empty: the NetworkClass's default resolvers for this zone
  repeated string allocatable_ip_ranges = 5; // e.g. ["10.0.1.3-10.0.1.127"]; empty means the whole IPv4 CIDR (minus network/broadcast/gateway)
}

message SubnetStatus {
  string phase = 1; // Pending (allocating) / Ready
  repeated kyuusha.resource.v1.Condition conditions = 2;
  repeated SubnetAddress addresses = 3; // effective CIDR/gateway, at most one per address family
  map<string, int64> values = 4;        // Subnet-level allocated values, e.g. {"vlan_id": 100}
  map<string, string> attributes = 5;   // merged from the pools/entries they came from
  repeated Allocation allocations = 6;
}

message Subnet {
  kyuusha.resource.v1.ObjectMeta meta = 1;
  SubnetSpec spec = 2;
  SubnetStatus status = 3;
}

message CreateSubnetRequest {
  string tenant_id = 1;
  string name = 2; // idempotency key: a repeated Create with the same (tenant_id, name) returns the existing Subnet
  SubnetSpec spec = 3;
  bool dry_run = 4;
  // Become meta.labels/meta.annotations -- see kyuusha.resource.v1.ObjectMeta.
  map<string, string> labels = 5;
  map<string, string> annotations = 6;
}

message GetSubnetRequest {
  string tenant_id = 1;
  string id = 2;
}

message ListSubnetsRequest {
  string tenant_id = 1;
}

message ListSubnetsResponse {
  repeated Subnet items = 1;
}

message UpdateSubnetRequest {
  Subnet subnet = 1; // subnet.meta.resource_version must match the stored value
  bool dry_run = 2;
  string tenant_id = 3; // mirrors subnet.meta.tenant_id; see vm.proto's UpdateVirtualMachineRequest for why this stays top-level
}

message DeleteSubnetRequest {
  string tenant_id = 1;
  string id = 2;
  bool dry_run = 3;
}

message WatchSubnetsRequest {
  string tenant_id = 1;
  int64 since_resource_version = 2;
}

message SubnetEvent {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    ADDED = 1;
    MODIFIED = 2;
    DELETED = 3;
    BOOKMARK = 4;
  }
  Type type = 1;
  Subnet subnet = 2;
  int64 resource_version = 3;
}

// Admin-only correction of system-written values (see
// SetNetworkStatusValuesRequest).
message SetSubnetStatusValuesRequest {
  string tenant_id = 1;
  string id = 2;
  map<string, int64> values = 3;
  map<string, string> attributes = 4;
}

service SubnetService {
  rpc Create(CreateSubnetRequest) returns (Subnet);
  rpc Get(GetSubnetRequest) returns (Subnet);
  rpc List(ListSubnetsRequest) returns (ListSubnetsResponse);
  rpc Update(UpdateSubnetRequest) returns (Subnet);
  rpc Delete(DeleteSubnetRequest) returns (google.protobuf.Empty);
  rpc Watch(WatchSubnetsRequest) returns (stream SubnetEvent);
  rpc SetStatusValues(SetSubnetStatusValuesRequest) returns (Subnet);
}
