syntax = "proto3";

package kyuusha.network.v1;

option go_package = "github.com/kiyuta1230/kyuusha/gen/go/kyuusha/network/v1;networkv1";

import "google/protobuf/empty.proto";
import "kyuusha/resource/v1/common.proto";

// SecurityGroup is a tenant-owned, allow-only set of rules attached to
// NetworkInterfaces explicitly (NetworkInterfaceSpec.security_group_ids).
// Traffic in either direction is denied unless some rule of some attached
// SecurityGroup allows it. See docs/specs/network.md「SecurityGroup」.

// SecurityGroupPeer is who a rule allows: the sender of traffic into the
// VM (ingress_rules) or the destination of traffic out of it
// (egress_rules). Exactly one is set; more kinds (e.g. a PrefixList) may be
// added to the oneof later.
message SecurityGroupPeer {
  oneof peer {
    string cidr = 1;              // IPv4 or IPv6, e.g. "0.0.0.0/0"
    string security_group_id = 2; // every address of every NetworkInterface the group is attached to; "self" = this group
    string network_id = 3;        // every address of every NetworkInterface on the Network
  }
}

message SecurityGroupRule {
  string protocol = 1;   // "" (any) / tcp / udp / icmp
  string port_range = 2; // destination port(s), tcp/udp only, e.g. "22", "2379-2380"; "" = all ports
  SecurityGroupPeer peer = 3;
  string description = 4;
}

message SecurityGroupSpec {
  string description = 1;
  repeated SecurityGroupRule ingress_rules = 2; // traffic allowed into the VM
  repeated SecurityGroupRule egress_rules = 3;  // traffic allowed out of the VM
  // Tenants (besides the owner) that may attach this group to their own
  // NetworkInterfaces or reference it as a peer.
  repeated string shared_with_tenant_ids = 4;
}

message SecurityGroupStatus {
  // Set on the default group kyuusha creates for a Network: it can't be
  // deleted while the Network exists, and every tenant that may use the
  // Network may use it too.
  string default_for_network_id = 1;
}

message SecurityGroup {
  kyuusha.resource.v1.ObjectMeta meta = 1;
  SecurityGroupSpec spec = 2;
  SecurityGroupStatus status = 3;
}

message CreateSecurityGroupRequest {
  string tenant_id = 1;
  string name = 2; // idempotency key
  SecurityGroupSpec spec = 3;
  map<string, string> labels = 4;
  map<string, string> annotations = 5;
}
// Get also returns a group owned by another tenant if tenant_id may use it
// (shared with it, or the default group of a Network it may use).
message GetSecurityGroupRequest { string tenant_id = 1; string id = 2; }
// Empty tenant_id lists every tenant's groups (cross-tenant roles only).
message ListSecurityGroupsRequest { string tenant_id = 1; }
message ListSecurityGroupsResponse { repeated SecurityGroup items = 1; }
// Replaces spec, labels and annotations (security_group.meta.resource_version
// must match); takes effect on every NetworkInterface the group is attached
// to.
message UpdateSecurityGroupRequest { string tenant_id = 1; SecurityGroup security_group = 2; }
// Rejected while attached to a NetworkInterface, referenced by another
// group's rule, or the default group of an existing Network.
message DeleteSecurityGroupRequest { string tenant_id = 1; string id = 2; }
message WatchSecurityGroupsRequest { string tenant_id = 1; int64 since_resource_version = 2; }
message SecurityGroupEvent {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    ADDED = 1;
    MODIFIED = 2;
    DELETED = 3;
    BOOKMARK = 4;
  }
  Type type = 1;
  SecurityGroup security_group = 2;
  int64 resource_version = 3;
}

service SecurityGroupService {
  rpc Create(CreateSecurityGroupRequest) returns (SecurityGroup);
  rpc Get(GetSecurityGroupRequest) returns (SecurityGroup);
  rpc List(ListSecurityGroupsRequest) returns (ListSecurityGroupsResponse);
  rpc Update(UpdateSecurityGroupRequest) returns (SecurityGroup);
  rpc Delete(DeleteSecurityGroupRequest) returns (google.protobuf.Empty);
  rpc Watch(WatchSecurityGroupsRequest) returns (stream SecurityGroupEvent);
}
