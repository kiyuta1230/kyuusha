syntax = "proto3";

package kyuusha.compute.v1;

option go_package = "github.com/kiyuta1230/kyuusha/gen/go/kyuusha/compute/v1;computev1";

import "google/protobuf/empty.proto";
import "kyuusha/resource/v1/common.proto";

// See docs/architecture.md "サービス共通のRPCパターン（例: VirtualMachine）"
// and "設計原則: 命名はOpenStackを踏襲しない" (no fixed machine_class catalog:
// vcpu/memory_mb are requested directly, governed by Quota instead).

enum VmmDriver {
  VMM_DRIVER_UNSPECIFIED = 0; // treated as FIRECRACKER
  VMM_DRIVER_FIRECRACKER = 1;
  // VMM_DRIVER_CLOUD_HYPERVISOR: cloud-hypervisor (rust-vmm, same lineage as
  // Firecracker) -- chosen over QEMU (2026-09-12) for the fuller device
  // model (VFIO passthrough, vhost-user) neither driver implements yet: a
  // real qemu-system-* binary turned out to need ~30 shared libraries and
  // legacy PC firmware blobs staged into any jail, none of which
  // cloud-hypervisor needs (single static binary, no BIOS emulation, direct
  // kernel boot only) -- see docs/specs/cloud-hypervisor-boot.md.
  VMM_DRIVER_CLOUD_HYPERVISOR = 2;
}

message NetworkAttachment {
  string subnet_id = 1;
  bool primary = 2;
}

message VolumeRequest {
  string volume_id = 1;
  string device_hint = 2;
}

message PciDeviceRequest {
  string vendor_id = 1;
  string device_id = 2;
  int32 count = 3;
}

message VirtualMachineSpec {
  string image_id = 1;
  int32 vcpu = 2;
  int64 memory_mb = 3;
  repeated NetworkAttachment network_interfaces = 4;
  repeated VolumeRequest volumes = 5;
  // 6, 7: removed 2026-09-12 (recovery_policy, persistent_root_disk).
  // Automatic hypervisor-loss recovery ("pet" VMs) was designed but never
  // implemented (real fencing -- distinguishing a genuinely dead
  // hypervisor from one merely unreachable over the network -- needs
  // infrastructure kyuusha isn't taking on; see docs/open-questions.md).
  // A KaaS layer already re-creates its own worker-node VMs on failure
  // (e.g. Cluster API's MachineHealthCheck), making kyuusha-side recovery
  // redundant for that case; a genuinely persistent root disk is a
  // separate, still-undesigned "volume boot" feature, not this field.
  string user_data = 8;
  VmmDriver driver_hint = 9;
  repeated PciDeviceRequest pci_devices = 10;
}

message VirtualMachineStatus {
  string phase = 1;
  repeated kyuusha.resource.v1.Condition conditions = 2;
  string hypervisor = 3;
  // 4: removed 2026-09-12 (root_volume_ref) -- see VirtualMachineSpec's
  // comment on the same removal.
  repeated string interface_refs = 5;
  repeated string volume_attachment_refs = 6;
}

message VirtualMachine {
  kyuusha.resource.v1.ObjectMeta meta = 1;
  VirtualMachineSpec spec = 2;
  VirtualMachineStatus status = 3;
}

message CreateVirtualMachineRequest {
  string tenant_id = 1;
  string name = 2; // idempotency key: a repeated Create with the same (tenant_id, name) returns the existing VM
  VirtualMachineSpec spec = 3;
  bool dry_run = 4;
}

message GetVirtualMachineRequest {
  string tenant_id = 1;
  string id = 2;
}

message ListVirtualMachinesRequest {
  string tenant_id = 1;
}

message ListVirtualMachinesResponse {
  repeated VirtualMachine items = 1;
}

message UpdateVirtualMachineRequest {
  VirtualMachine vm = 1; // vm.meta.resource_version must match the stored value
  bool dry_run = 2;
  // Mirrors vm.meta.tenant_id: kept as a top-level field (like every other
  // request here) so internal/authz's TenantIDGetter check can authorize
  // this RPC without unwrapping the nested message.
  string tenant_id = 3;
}

message DeleteVirtualMachineRequest {
  string tenant_id = 1;
  string id = 2;
  bool dry_run = 3;
}

// StopVirtualMachineRequest: Running -> Stopping -> Stopped. Tears down the
// real VMM process (compute-agent confirms back), but never removes the
// jail/run directory backing this VM's root disk -- that only happens at
// actual Delete (see docs/architecture.md "VM lifecycle": kyuusha's
// ephemeral root disk survives a Stop/Start cycle, only Delete destroys it).
message StopVirtualMachineRequest {
  string tenant_id = 1;
  string id = 2;
  // force=true sends SIGKILL immediately instead of the default
  // SIGTERM-then-grace-period-then-SIGKILL.
  bool force = 3;
}

// StartVirtualMachineRequest: Stopped -> Starting -> Provisioning -> Running,
// reusing the same network/volume/boot plumbing Create's own scheduling
// already uses (see reconciler.go's provisionAndPublish) -- the VM's
// existing NetworkInterfaces/VolumeAttachments are reattached, and its
// already-placed root disk is reused rather than recopied from the Image
// (see internal/compute-agent/fcvmm and .../chvmm's Boot).
message StartVirtualMachineRequest {
  string tenant_id = 1;
  string id = 2;
}

// ResizeVirtualMachineRequest: a Stopped VM does a cold resize (spec-only,
// takes effect on the next Start); a Running VM whose driver_hint is
// CLOUD_HYPERVISOR does a live resize instead, via cloud-hypervisor's
// --api-socket, no downtime -- any other phase/driver combination (Running+
// FIRECRACKER included) is rejected with FailedPrecondition, since live
// resize is structurally impossible on Firecracker (see docs/specs/
// virtual-machine.md「リサイズ」). No resource_version field: like Stop/
// Start, this does its own Get-then-mutate-then-Update internally and
// relies on resource.Store.Update's own compare-and-swap, rather than
// asking the caller to supply one.
message ResizeVirtualMachineRequest {
  string tenant_id = 1;
  string id = 2;
  int32 vcpu = 3;
  int64 memory_mb = 4;
  // allow_migrate: only meaningful for the cold path (Stopped VM). When the
  // VM's current Hypervisor doesn't have room for the new size, a plain
  // Resize is rejected with ResourceExhausted (kyuusha never migrates a VM
  // as a side effect the caller didn't ask for). Setting this opts into a
  // migration-assisted fallback instead: find a different Hypervisor with
  // room for the new size and move the VM there (same cold-migration
  // semantics as VirtualMachineService.Migrate -- the root disk is
  // re-provisioned fresh from the Image on the new Hypervisor, any
  // guest-side changes to it are lost; NetworkInterfaces/VolumeAttachments
  // carry over unchanged). Ignored for the live path (Running+
  // CLOUD_HYPERVISOR): a live resize never migrates.
  bool allow_migrate = 5;
}

// AttachVolumeRequest/DetachVolumeRequest: same cold/live branching as
// ResizeVirtualMachineRequest above (Stopped = cold, Running+
// CLOUD_HYPERVISOR = live via cloud-hypervisor's --api-socket -- see
// docs/specs/volume.md「Volume attach/detach」). No resource_version field,
// same reasoning as ResizeVirtualMachineRequest above.
message AttachVolumeRequest {
  string tenant_id = 1;
  string id = 2; // vm id
  string volume_id = 3;
  string device_hint = 4;
}
message DetachVolumeRequest {
  string tenant_id = 1;
  string id = 2; // vm id
  string volume_id = 3;
}

// MigrateVirtualMachineRequest: cold migration only -- the VM must be
// Stopped (FailedPrecondition otherwise, same convention as Start). Its
// root disk is re-provisioned fresh from its Image on the new Hypervisor
// (any guest-side changes to it since last boot are lost -- kyuusha's root
// disk is deliberately ephemeral and host-local, see docs/specs/
// virtual-machine.md「マイグレーション」), while its NetworkInterfaces
// (IP/MAC) and VolumeAttachments (Volume data, already
// Hypervisor-independent) carry over unchanged.
//
// target_hypervisor is optional: empty lets the scheduler auto-pick
// (excluding the VM's current Hypervisor, same hard constraints as
// Create); set it to require that specific Hypervisor -- still validated
// against the same filters (schedulable/Ready/zone/driver/capacity) rather
// than trusted blindly, rejected with ResourceExhausted/FailedPrecondition
// if it doesn't qualify.
message MigrateVirtualMachineRequest {
  string tenant_id = 1;
  string id = 2;
  string target_hypervisor = 3;
}

message WatchVirtualMachinesRequest {
  string tenant_id = 1;
  int64 since_resource_version = 2;
  // Optional: if set, only replay/stream events for VMs whose
  // meta.finalizers currently contains an entry with this name -- see
  // docs/architecture.md "Finalizer" 's discussion of external controllers
  // watching at scale. An external controller that only cares about VMs it
  // has itself placed a finalizer on should set this instead of watching
  // every VM in the tenant.
  string finalizer_name = 3;
}

message VirtualMachineEvent {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    ADDED = 1;
    MODIFIED = 2;
    DELETED = 3;
    BOOKMARK = 4;
  }
  Type type = 1;
  VirtualMachine vm = 2;
  int64 resource_version = 3;
}

message StreamConsoleRequest {
  string tenant_id = 1;
  string id = 2;         // vm id
  int64 tail_bytes = 3;  // 0: server default (~64KiB); negative: entire log
  bool follow = 4;       // keep streaming new output after replaying history, like `tail -f`
}

message ConsoleChunk {
  bytes data = 1;
}

service VirtualMachineService {
  rpc Create(CreateVirtualMachineRequest) returns (VirtualMachine);
  rpc Get(GetVirtualMachineRequest) returns (VirtualMachine);
  rpc List(ListVirtualMachinesRequest) returns (ListVirtualMachinesResponse);
  rpc Update(UpdateVirtualMachineRequest) returns (VirtualMachine);
  rpc Delete(DeleteVirtualMachineRequest) returns (google.protobuf.Empty);
  // See StopVirtualMachineRequest/StartVirtualMachineRequest above. Both
  // reject with FailedPrecondition if the VM isn't in the required phase
  // (Running for Stop, Stopped for Start).
  rpc Stop(StopVirtualMachineRequest) returns (VirtualMachine);
  rpc Start(StartVirtualMachineRequest) returns (VirtualMachine);
  // Resize changes vcpu/memory_mb of a Stopped VM in place (cold), or of a
  // Running+CLOUD_HYPERVISOR VM live with no downtime (see
  // ResizeVirtualMachineRequest above): FailedPrecondition for any other
  // phase/driver combination, ResourceExhausted if the new size would
  // exceed tenant quota or the current Hypervisor's free capacity -- the
  // cold path only re-schedules to a different Hypervisor if allow_migrate
  // was set (see ResizeVirtualMachineRequest.allow_migrate and
  // docs/specs/vm-scheduling.md), otherwise this is a straight rejection,
  // same as the live path always is. Unavailable if a live resize's
  // compute-agent round trip times out.
  rpc Resize(ResizeVirtualMachineRequest) returns (VirtualMachine);
  // AttachVolume/DetachVolume: cold (Stopped VM) or live (Running+
  // CLOUD_HYPERVISOR, no downtime) -- see AttachVolumeRequest above. Same
  // FailedPrecondition/Unavailable contract as Resize for any other
  // phase/driver combination or a timed-out live round trip.
  rpc AttachVolume(AttachVolumeRequest) returns (VirtualMachine);
  rpc DetachVolume(DetachVolumeRequest) returns (VirtualMachine);
  // Migrate: cold-only VM migration to a different Hypervisor (see
  // MigrateVirtualMachineRequest above). FailedPrecondition if the VM
  // isn't Stopped; ResourceExhausted/FailedPrecondition if no Hypervisor
  // (or the explicitly requested target_hypervisor) currently qualifies.
  rpc Migrate(MigrateVirtualMachineRequest) returns (VirtualMachine);
  rpc Watch(WatchVirtualMachinesRequest) returns (stream VirtualMachineEvent);
  // Serial console (see docs/specs/firecracker-boot.md). Only meaningful
  // for a VM that has actually been scheduled and had a real VMM boot
  // attempted; NotFound/FailedPrecondition otherwise.
  rpc StreamConsole(StreamConsoleRequest) returns (stream ConsoleChunk);
}
