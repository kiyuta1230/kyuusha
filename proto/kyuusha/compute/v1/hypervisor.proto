syntax = "proto3";

package kyuusha.compute.v1;

option go_package = "gitlab.com/ki.yuta1230/kyuusha/gen/go/kyuusha/compute/v1;computev1";

import "kyuusha/resource/v1/common.proto";

// See docs/architecture.md "computeサービスのリソース: Hypervisor": an internal
// management object for scheduling, not a KaaS-facing resource. Register is
// compute-agent's self-registration/re-registration at startup, called
// directly by compute-agent -- never through api-gateway, since this is
// east-west traffic, not north-south (see "Hypervisor自己登録とzone割当").
// Get/List/Watch/SetSchedulable are the only externally (api-gateway)
// exposed RPCs, and are admin-only there (see SetSchedulableRequest).

message PciDevice {
  string pci_address = 1; // e.g. "0000:3b:00.0"
  string vendor_id = 2;   // e.g. "10de" (NVIDIA)
  string device_id = 3;   // e.g. "20b0" (A100)
  bool allocated = 4;
}

// StorageConnection is one storage backend session this Hypervisor already
// has established (an iSCSI/NVMe-oF login, or an NFS mount) -- a host-level
// prerequisite compute-agent's own runtime never sets up itself, the same
// "host already has it" contract as /dev/kvm (see docs/architecture.md
// "block-storageのバックエンド抽象化"「訂正: 責務の境界を...」). A
// VolumeSpec.storage_connection names one of these by name (plain string
// match, not a separate CRUD resource).
message StorageConnection {
  string name = 1; // arbitrary operator-chosen name, e.g. "tank1-iscsi"
  // local_path is only meaningful for NFS: the local mount point this
  // connection's export is mounted at on *this* Hypervisor (other
  // Hypervisors may mount the same export at a different local path).
  // Ignored for ISCSI/NVME_OF, which discover devices by serial/WWN under
  // /dev/disk/by-id/ instead of a path.
  string local_path = 2;
}

// HypervisorSpec is operator intent, set only via SetSchedulable -- never
// touched by Register, so an agent restart can't silently undo an
// operator's maintenance action. Contrast HypervisorStatus, which is
// entirely agent/heartbeat-derived.
message HypervisorSpec {
  bool schedulable = 1; // false: excluded from scheduling regardless of phase (maintenance)
}

message HypervisorStatus {
  string phase = 1; // Ready / NotReady, heartbeat-based
  string zone = 2;
  int64 last_heartbeat_at = 3;
  int32 allocatable_vcpu = 4;
  int64 allocatable_memory_mb = 5;
  int32 allocated_vcpu = 6;
  int64 allocated_memory_mb = 7;
  repeated string supported_drivers = 8; // e.g. ["firecracker", "qemu"]
  repeated PciDevice available_devices = 9;
  repeated StorageConnection storage_connections = 10;
}

message Hypervisor {
  kyuusha.resource.v1.ObjectMeta meta = 1;
  HypervisorSpec spec = 2;
  HypervisorStatus status = 3;
}

message RegisterHypervisorRequest {
  string hypervisor = 1; // stable id, e.g. "hypervisor-1"; becomes meta.id and meta.name
  int32 allocatable_vcpu = 3;
  int64 allocatable_memory_mb = 4;
  repeated string supported_drivers = 5;
  repeated StorageConnection storage_connections = 7;
  // Required: a zone-scoped JWT minted by `kyuusha hypervisor bootstrap-token
  // create -zone=...` (internal/bootstraptoken). Its `zone` claim -- not any
  // self-reported value from the agent -- becomes the registered
  // Hypervisor's zone; see docs/architecture.md "Hypervisor自己登録とzone割当".
  string bootstrap_token = 6;
}

message GetHypervisorRequest {
  string hypervisor = 1;
}

message ListHypervisorsRequest {}

message ListHypervisorsResponse {
  repeated Hypervisor items = 1;
}

message WatchHypervisorsRequest {
  int64 since_resource_version = 1;
}

// SetSchedulableRequest carries no tenant_id -- Hypervisor isn't a
// tenant-scoped resource -- which makes it admin-only through api-gateway
// via internal/authz's rule for requests without one (see
// identity.CreateTenantRequest for the same reasoning).
message SetSchedulableRequest {
  string hypervisor = 1;
  bool schedulable = 2;
}

message HypervisorEvent {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    ADDED = 1;
    MODIFIED = 2;
    DELETED = 3;
    BOOKMARK = 4;
  }
  Type type = 1;
  Hypervisor hypervisor = 2;
  int64 resource_version = 3;
}

service HypervisorService {
  // Idempotent: re-registering the same hypervisor (e.g. on compute-agent
  // restart) refreshes zone/capacity/drivers rather than erroring, and
  // preserves the scheduler's existing capacity reservations against it.
  rpc Register(RegisterHypervisorRequest) returns (Hypervisor);
  rpc Get(GetHypervisorRequest) returns (Hypervisor);
  rpc List(ListHypervisorsRequest) returns (ListHypervisorsResponse);
  rpc Watch(WatchHypervisorsRequest) returns (stream HypervisorEvent);
  // Marks a Hypervisor schedulable or not (maintenance), independent of its
  // heartbeat-derived phase. Admin-only.
  rpc SetSchedulable(SetSchedulableRequest) returns (Hypervisor);
}
